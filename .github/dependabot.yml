# open-pull-requests-limit: 0 disables version updates for the ecosystem carrying it; Dependabot's security
# updates are unaffected by it. Each PR is gated by the Build workflow before merge.
# Security review: car-server M-7 (supply chain), car-ui N7 (residual advisories).
version: 2
updates:
  # Each directory listed here is scanned for poms. Both module levels are included because third-party
  # versions are literal in module poms down to the nested aggregators (jiotty-connector-google/*).
  - package-ecosystem: "maven"
    directories:
      - "/"
      - "/*"
      - "/*/*"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    # One PR per month for the routine noise, individual PRs for majors — a grouped major is impossible to
    # review or revert selectively. Security advisories are never grouped and ignore the schedule.
    groups:
      maven-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"

  # Version updates are on here because a SHA pin is immutable: an action release carrying no advisory moves
  # nothing on its own.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # Crossing an action major moves the Node runtime the runner must provide, so it is a decision rather
      # than a bump, and `/refresh-dependencies actions` is where it is taken.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "ci"
