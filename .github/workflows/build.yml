name: Build

# Gates every change to main and every Dependabot pull request, so a proposed dependency bump is verified by
# CI before it can be merged.
on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: liberica
          java-version: "25"
          cache: maven

      # jiotty is the root of the dependency chain: everything it needs comes from Maven Central.
      - name: Build
        run: ./mvnw -T1C -B verify
