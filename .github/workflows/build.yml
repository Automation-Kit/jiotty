name: Build

# Gates every change to main and every Dependabot pull request, so a proposed dependency bump is verified by
# CI before it can be merged.
on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: liberica
          java-version: "25"
          cache: maven

      # jiotty is the root of the dependency chain: everything it needs comes from Maven Central.
      - name: Build
        run: ./mvnw -T1C -B verify
