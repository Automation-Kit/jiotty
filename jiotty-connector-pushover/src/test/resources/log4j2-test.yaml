Configuration:
  shutdownHook: disable
  status: warn
  appenders:
    Console:
      name: STDOUT
      PatternLayout:
        Pattern: "%d %p [%t] [due %X{task.due}] [cur %X{current.time}]%X{waveId} %c{1.1.1.*} %m%n"
  Loggers:
    Root:
      level: '${sys:log4j.root.level:-INFO}'
      AppenderRef:
        - ref: STDOUT
    Logger:
      - name: net.yudichev.jiotty.connector.pushover
        level: DEBUG
      - name: net.yudichev.jiotty.common.rest
        level: DEBUG