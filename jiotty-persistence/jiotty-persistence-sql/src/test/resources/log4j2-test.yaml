Configuration:
  status: warn
  appenders:
    Console:
      name: STDOUT
      PatternLayout:
        Pattern: "%d %p [%t] %replace{[%X{thread}] }{\\[\\] }{}[due %X{task.due}] [cur %X{current.time}]%X{waveId} %c{1.1.1.*} %m%n"
  Loggers:
    Root:
      level: '${sys:log4j.root.level:-DEBUG}'
      AppenderRef:
        - ref: STDOUT